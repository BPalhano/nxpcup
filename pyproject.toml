[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nxpcup-vision"
version = "0.1.0"
description = "NXP Cup Autonomous Driving: Edge AI & MLOps with MicroViT, ONNX, and TensorRT"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=0.9.12",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "mlflow>=2.10.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "evidently>=0.4.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["main*"]
exclude = ["recording_dataset*", "main/tf*", "main/deep_learning*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "main/deep_learning",
    "main/tf",
    "main/traitement_image",
    "recording_dataset",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["main/tests"]
pythonpath = ["main", "."]
addopts = "-v"
